services:
  lightdns:
    build: .
    command: ["-database", "/var/lib/lightdns/lightdns.db", "-config", "/etc/lightdns/config.yaml", "-state", "/var/lib/lightdns/config.yaml"]
    restart: unless-stopped
    ports:
      - "53:53/udp"
      - "53:53/tcp"
      - "127.0.0.1:8080:8080/tcp"
    volumes:
      - "./config.compose.yaml:/etc/lightdns/config.yaml:ro"
      - "lightdns-state:/var/lib/lightdns"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true

  lightdns-init:
    build: .
    profiles: ["setup"]
    command: ["-database", "/var/lib/lightdns/lightdns.db", "-config", "/etc/lightdns/config.yaml", "-state", "/var/lib/lightdns/config.yaml", "-bootstrap-password-file", "/run/secrets/admin_password", "-init-only"]
    volumes:
      - "./config.compose.yaml:/etc/lightdns/config.yaml:ro"
      - "./admin-password.txt:/run/secrets/admin_password:ro"
      - "lightdns-state:/var/lib/lightdns"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true

volumes:
  lightdns-state:
