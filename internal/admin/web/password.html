<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Change your LightDNS password</title>
  <link rel="stylesheet" href="/login.css">
</head>
<body>
  <main>
    <form method="post" action="/change-password">
      <h1>Change password</h1>
      <label><span>Current password</span><input name="current_password" type="password" autocomplete="current-password" required autofocus></label>
      <label><span>New password</span><input name="new_password" type="password" autocomplete="new-password" minlength="12" required></label>
      <label><span>Confirm new password</span><input name="confirmation" type="password" autocomplete="new-password" minlength="12" required></label>
      <button type="submit">Change password</button>
    </form>
  </main>
</body>
</html>
