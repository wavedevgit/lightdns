<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Sign in to LightDNS</title>
  <link rel="stylesheet" href="/login.css">
</head>
<body>
  <main>
    <form method="post" action="/login">
      <span class="brand" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 13h4v8H3v-8Zm7-10h4v18h-4V3Zm7 6h4v12h-4V9Z"/></svg></span>
      <h1>Sign in</h1>
      <label><span>Admin token</span><input name="token" type="password" autocomplete="current-password" placeholder="Admin token" required autofocus></label>
      <button type="submit">Open dashboard</button>
    </form>
  </main>
</body>
</html>
